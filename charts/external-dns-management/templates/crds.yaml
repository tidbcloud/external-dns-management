{{- if .Values.createCRDs }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsentries.dns.gardener.cloud
  labels:
    helm.sh/chart: {{ include "external-dns-management.chart" . }}
    app.kubernetes.io/name: {{ include "external-dns-management.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  group: dns.gardener.cloud
  names:
    kind: DNSEntry
    listKind: DNSEntryList
    plural: dnsentries
    shortNames:
    - dnse
    singular: dnsentry
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: { }
    additionalPrinterColumns:
      - jsonPath: .spec.dnsName
        description: DNS ObjectName
        name: DNS
        type: string
      - jsonPath: .status.providerType
        description: Provider type
        name: TYPE
        type: string
      - jsonPath: .status.provider
        description: Provider
        name: PROVIDER
        type: string
      - jsonPath: .status.state
        description: Status of DNS entry in cloud provider
        name: STATUS
        type: string
      - jsonPath: .metadata.creationTimestamp
        name: AGE
        type: date
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsowners.dns.gardener.cloud
  labels:
    helm.sh/chart: {{ include "external-dns-management.chart" . }}
    app.kubernetes.io/name: {{ include "external-dns-management.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  group: dns.gardener.cloud
  names:
    kind: DNSOwner
    listKind: DNSOwnerList
    plural: dnsowners
    shortNames:
    - dnso
    singular: dnsowner
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
      - jsonPath: .spec.ownerId
        description: Owner Id
        name: OWNERID
        type: string
      - jsonPath: .metadata.creationTimestamp
        name: AGE
        type: date
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsproviders.dns.gardener.cloud
  labels:
    helm.sh/chart: {{ include "external-dns-management.chart" . }}
    app.kubernetes.io/name: {{ include "external-dns-management.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  group: dns.gardener.cloud
  names:
    kind: DNSProvider
    listKind: DNSProviderList
    plural: dnsproviders
    shortNames:
    - dnspr
    singular: dnsprovider
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: { }
    additionalPrinterColumns:
      - jsonPath: .spec.type
        description: Provider type
        name: TYPE
        type: string
      - jsonPath: .status.state
        description: Status of DNS provider
        name: STATUS
        type: string
      - jsonPath: .metadata.creationTimestamp
        name: AGE
        type: date
{{- end }}
